<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#152232; --sub:#5b6b7b; --line:#dde4ea;
    --brand:#1f4e79; --brand-deep:#14385f; --accent:#0b6e99;
    --ok:#0a6045; --warn:#7a4f00; --danger:#c8341f;
    --wrap:1180px; --pad:24px;
  }
  @media (max-width:640px){ :root{ --pad:16px; } }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  body{font-size:15px; line-height:1.65; word-break:keep-all; overflow-wrap:break-word;}

  /* ── 상단 메뉴: 고정. 스크롤은 본문만 ─────────────────────────────────
     로고는 왼쪽, 메뉴는 오른쪽. 둘을 같은 가운데선에 세운다.
     sticky 가 아니라 fixed 다 — 조상에 overflow 가 걸리면 sticky 는 조용히 죽는다. */
  .topnav{position:fixed; top:0; left:0; right:0; z-index:40;
    background:var(--brand-deep); border-bottom:1px solid rgba(255,255,255,.12);}
  .topnav-inner{display:flex; align-items:center; justify-content:space-between;
    gap:20px; max-width:var(--wrap); margin:0 auto; padding:0 var(--pad); min-height:56px;}
  .topnav-brand{display:flex; align-items:center; min-height:56px;
    color:#fff; font-weight:750; font-size:14.5px; text-decoration:none; white-space:nowrap; flex:0 0 auto;}
  .topnav-brand small{font-weight:400; opacity:.7; font-size:12px; margin-left:8px;}
  .topnav-links{display:flex; align-items:center; gap:2px; list-style:none;
    margin:0; padding:0; overflow-x:auto; scrollbar-width:none; min-width:0;}
  .topnav-links::-webkit-scrollbar{display:none;}
  .topnav-links a{display:flex; align-items:center; min-height:56px; padding:0 12px;
    color:rgba(255,255,255,.82); text-decoration:none; font-size:13.5px; font-weight:600;
    white-space:nowrap; border-bottom:2px solid transparent; transition:color .15s,border-color .15s;}
  .topnav-links a:hover{color:#fff;}
  .topnav-links a.active{color:#fff; border-bottom-color:#7ec8a0;}
  @media (max-width:860px){
    .topnav-inner{gap:10px; padding:0 14px; min-height:52px;}
    .topnav-brand{min-height:52px; font-size:13.5px;}
    .topnav-brand small{display:none;}
    .topnav-links a{min-height:52px; padding:0 9px; font-size:13px;}
  }

  /* 고정 바가 흐름에서 빠졌으므로 본문을 그만큼 내린다 */
  main{padding-top:calc(56px + 34px); padding-bottom:56px;}
  @media (max-width:860px){ main{padding-top:calc(52px + 26px);} }
  .wrap{max-width:var(--wrap); margin:0 auto; padding:0 var(--pad);}

  .hero{background:linear-gradient(180deg,var(--brand-deep),var(--brand)); color:#fff;
    padding:56px 0 40px; margin-top:56px;}
  @media (max-width:860px){ .hero{margin-top:52px; padding:40px 0 30px;} }
  .hero + main{padding-top:34px;}
  .hero .eyebrow{font-size:12.5px; letter-spacing:.08em; opacity:.75; margin-bottom:10px;}
  .hero h1{font-size:28px; line-height:1.3; font-weight:750; margin-bottom:12px;}
  .hero p{max-width:60ch; color:rgba(255,255,255,.86); font-size:15px;}

  h2{font-size:20px; font-weight:700; margin:34px 0 8px;}
  h3{font-size:16px; font-weight:700; margin:22px 0 6px;}
  main > .wrap > :first-child{margin-top:0;}
  p{margin:0 0 14px;}
  .sub{color:var(--sub); font-size:14px;}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em;
    background:#eef2f6; border-radius:4px; padding:1px 5px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px; margin-bottom:18px;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(0,300px)); gap:16px;}
  .cards .card{margin-bottom:0;}
  /* 격자 안에서는 gap 이 간격을 준다 — 형제 여백을 쓰면 첫 칸만 커진다 */
  .cards > .card + .card{margin-top:0;}

  /* label 은 기본이 inline 이다 — block 으로 두지 않으면 안쪽 글자가 제멋대로 흐른다 */
  .drop{display:block; border:2px dashed #b9c6d6; border-radius:12px; background:#fbfdff;
    padding:32px 20px; text-align:center; cursor:pointer; transition:border-color .15s,background .15s;}
  .drop:hover,.drop.over{border-color:var(--accent); background:#f0f8fc;}
  .drop b{display:block; font-size:15.5px; margin-bottom:6px;}
  .drop span{color:var(--sub); font-size:13.5px;}
  input[type=file]{display:none;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:42px; padding:0 18px; border-radius:9px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-size:14px; font-weight:650; cursor:pointer;
    text-decoration:none;}
  .btn:hover{border-color:#9fb2c4;}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn.primary:hover{background:var(--brand-deep);}
  .btn.green{background:var(--ok); border-color:var(--ok); color:#fff;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btnrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}

  .note{border-left:4px solid var(--accent); background:#eef6fa; color:#0b3a4f;
    padding:14px 16px; border-radius:8px; font-size:14px; margin:16px 0;}
  .warn{border-left:4px solid var(--danger); background:#fdeae7; color:#7a1a0c;
    padding:14px 16px; border-radius:8px; font-size:14px; margin:16px 0;}
  .ok{border-left:4px solid var(--ok); background:#e9f6f0; color:#08422a;
    padding:14px 16px; border-radius:8px; font-size:14px; margin:16px 0;}

  .tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:#fff;}
  table{border-collapse:collapse; width:100%; font-size:13.5px;}
  th,td{border-bottom:1px solid var(--line); padding:9px 12px; text-align:left; white-space:nowrap;}
  th{background:#eef2f6; font-weight:700; position:sticky; top:0;}
  tr:last-child td{border-bottom:0;}
  td.num{text-align:right; font-variant-numeric:tabular-nums;}
  .flag{color:var(--danger); font-weight:700;}

  .steps{counter-reset:s; list-style:none; padding:0; margin:14px 0;}
  .steps li{counter-increment:s; position:relative; padding-left:36px; margin-bottom:12px;}
  .steps li::before{content:counter(s); position:absolute; left:0; top:1px;
    width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center;}

  footer{border-top:1px solid var(--line); padding:26px 0 44px; color:var(--sub); font-size:13px;}
  .prev{border:1px solid var(--line); border-radius:10px; background:#fff; padding:16px; overflow-x:auto;}
  .muted{color:var(--sub);}
  .filelist{margin:14px 0 0; padding:0; list-style:none; font-size:13.5px;}
  .filelist li{padding:6px 0; border-bottom:1px solid var(--line); color:var(--sub);}
  .filelist li:last-child{border-bottom:0;}
</style>
